name: OASEAS ECLSS CI Pipelin
on:
  push:
    branches: [ main, ci/mqtt-fixes-deps ]
    branches: [ develop/ngina-orchestrator ]
name: NGINA CI Pipeline

on:
  push:
    branches: [ main, develop/ngina-orchestrator ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-base: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Root Dependencies
      run: npm install
    - name: Build Backend & Validate TypeScript
      run: |
        cd src/backend
        npm install
        npm run build --if-present
      - name: Checkout code
        uses: actions/checkout@v4

  build-and-test:
    name: Build & Test (Node + Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root Node deps (if any)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Build backend & validate TypeScript
        run: |
          if [ -d src/backend ]; then
            cd src/backend
            npm ci
            npm run build --if-present
            if [ -f tsconfig.json ]; then npx tsc --noEmit; fi
            cd -
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check (compile)
        run: |
          python -m compileall .

  node-build:
    name: Node: build publisher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build Node publisher
        run: |
          cd src/backend || exit 0
          if [ -f package.json ]; then npm install; npm run build || true; fi

      - name: Lint/Type check (tsc)
        run: |
          cd src/backend || exit 0
          if [ -f tsconfig.json ]; then npx tsc --noEmit; fi
      - name: Python syntax check
        run: |
          python -m compileall .

      - name: Workflow summary
        run: echo "NGINA CI: Node and Python checks completed."
