name: OASEAS ECLSS CI Pipeline
on:
  push:
    branches: [ main, ci/mqtt-fixes-deps ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-base: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Root Dependencies
      run: npm install
    - name: Build Backend & Validate TypeScript
      run: |
        cd src/backend
        npm install
        npm run build --if-present
