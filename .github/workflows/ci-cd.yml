name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop/ngina-orchestrator
  pull_request:
    branches:
      - main
      - develop/ngina-orchestrator

env:
  DOCKER_HUB_REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Python Backend Quality Checks
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: Run black (format check)
        run: black --check app.py
        continue-on-error: true

      - name: Run isort (import check)
        run: isort --check-only app.py
        continue-on-error: true

      - name: Run flake8 (linting)
        run: flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with pytest
        run: pytest tests/ -v --cov=app --cov-report=xml
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
        continue-on-error: true

  # Node.js Backend Quality Checks
  node-lint:
    name: TypeScript Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm install
        working-directory: src/backend

      - name: Lint TypeScript
        run: npm run lint
        working-directory: src/backend
        continue-on-error: true

      - name: Check TypeScript compilation
        run: npx tsc --noEmit
        working-directory: src/backend

  node-test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm install
        working-directory: src/backend

      - name: Run tests
        run: npm test
        working-directory: src/backend
        continue-on-error: true

  # Docker Build & Push
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [python-lint, node-lint]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image-name: ngina-python-api
            context: .
          - dockerfile: src/backend/Dockerfile
            image-name: ngina-node-publisher
            context: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop/ngina-orchestrator" ]]; then
            echo "tag=develop" >> $GITHUB_OUTPUT
          else
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v4
        if: github.event_name == 'pull_request'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          tags: ${{ env.DOCKER_HUB_REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ matrix.image-name }}:${{ steps.meta.outputs.tag }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        if: github.event_name == 'push'
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        if: github.event_name == 'push'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ matrix.image-name }}:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKER_HUB_REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ matrix.image-name }}:${{ github.sha }}

  # Validate Docker Compose
  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker-compose config --quiet

  # Integration Tests (Docker Compose)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'
    services:
      mosquitto:
        image: eclipse-mosquitto:2.0
        options: >-
          --health-cmd "mosquitto_sub -h localhost -t '#' -C 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1883:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run integration tests
        run: pytest tests/integration/ -v
        env:
          FLASK_ENV: test
          MQTT_URL: mqtt://localhost:1883
        continue-on-error: true

  # Summary
  ci-success:
    name: CI Pipeline Complete
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, node-lint, node-test, docker-build, docker-compose-validate]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.python-lint.result }}" == "failure" || \
                "${{ needs.python-test.result }}" == "failure" || \
                "${{ needs.node-lint.result }}" == "failure" || \
                "${{ needs.node-test.result }}" == "failure" || \
                "${{ needs.docker-build.result }}" == "failure" || \
                "${{ needs.docker-compose-validate.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
